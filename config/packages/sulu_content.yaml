sulu_content:
    # Declaring a workflow is what enables the review flow, there is no separate on/off switch.
    # With no `request_workflows` at all, the resolver returns null for every content and publishing
    # stays direct.
    request_workflows:
        # The `default` workflow applies to every template that does not declare its own
        # `sulu_content.request_workflow` form tag. A template tagged workflow="none" opts out.
        default:
            # Resource keys the default workflow covers. Snippets are deliberately left out, so they
            # keep publishing directly. Remove this key to have it apply to every resource.
            resources: ['pages', 'articles']

            # People whose approval is needed before the request counts as approved. Validators do
            # not count: they report on the content, they do not stand in for a reviewer. Self-review
            # is not allowed, so these are *other* users holding the `review` permission. Someone with
            # the `live` permission can still take the "Bypass review and publish" route.
            required_human_approvals: 2

            # Hard gates, checked synchronously on `request_for_review`, `publish` and
            # `bypass_publish` alike. A failing pre-validator aborts the transition, so nothing is
            # written and the author is told what to fix while the content is still editable. Use
            # these for anything that must never be waved through, on any route to live.
            pre_validators:
                seo_required:
                    fields: ['title', 'description']
                excerpt_required:
                    fields: ['title']

            # Automated checks, run over the message bus once the request exists, so a slow one (an
            # LLM, a remote service) does not hold up the request. They never count towards
            # `required_human_approvals`: a check reports on the content, it does not stand in for a
            # reviewer. `blocking: true` makes a failure hold the request until the check passes,
            # which is the exception; by default a check is informational. Route the message (see
            # config/packages/messenger.yaml) to move them onto a worker, anything doing I/O beyond
            # the local database must be routed.
            validators:
                unpublished_references:
                    blocking: true

        # The "simple case": one approval, no automated checks, no hard gates. A page using the
        # `simple-review` template goes to one reviewer and is publishable as soon as that person
        # approves. Named workflows are selected by the template tag, not by resource.
        simple:
            required_human_approvals: 1
